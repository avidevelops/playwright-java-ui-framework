# ── UI Test Configuration ──────────────────────────────────────────────────────
# Base URL of the frontend application under test.
# Default: local Conduit dev server (https://github.com/gothinkster/realworld)
qa.ui.baseUrl=http://localhost:4100

# Execution mode:
#   mock — Playwright intercepts every API call; no real backend needed.
#   live — makes real HTTP requests; requires a running backend.
qa.ui.mode=mock

# Run browser in headless mode.
#   true  = CI / no visible browser window
#   false = local debugging / see what the browser is doing
qa.ui.headless=true

# Browser viewport dimensions (pixels)
qa.ui.viewport.width=1440
qa.ui.viewport.height=900

# Directory where failure screenshots are saved
qa.ui.screenshot.dir=target/screenshots
